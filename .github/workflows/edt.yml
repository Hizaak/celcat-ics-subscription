name: Mise a jour EDT

on:
  schedule:
    - cron: "0 6 * * *"    # 07h00 en ete
    - cron: "30 11 * * *"  # 12h30 en ete
    - cron: "0 20 * * *"   # 22h00 en ete
  workflow_dispatch:         # bouton manuel

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generer l'ICS
        run: |
          python celcat_ics.py \
            --group "4TVL904S M2 Algorithms, Models and Verification" \
            --exclude "4TIN914U" \
            --start 2026-09-01 \
            --end 2027-07-31 \
            -o edt.ics

      - name: Commiter si changement
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add edt.ics
          git diff --staged --quiet || git commit -m "MAJ EDT $(date -u +%F\ %H:%M)"
          git push
